[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consumer-regulatory-agent"
version = "0.1.0"
description = "Consumer Regulatory Protection Agent on Amazon Bedrock AgentCore"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.178.0",
    "constructs>=10.0.0,<11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
    "moto>=5.0.0",
    "boto3>=1.34.0",
    "pytest-cov>=4.1.0",
]
lambda = [
    "boto3>=1.34.0",
    "aws-xray-sdk>=2.12.0",
    "strands-agents>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["cdk*", "lambdas*"]
