[project]
name = "agent-core-mcp-demo"
version = "0.1.0"
description = "Deploy AWS Labs MCP servers (S3 Tables & Redshift) on Amazon Bedrock AgentCore Runtime with a unified Gateway and Bedrock Agent for natural language data exploration."
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "D&A Architecture Team"}
]

dependencies = [
    "aws-cdk-lib>=2.150.0",
    "boto3>=1.35.0",
    "constructs>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "moto>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
