AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Lambda that invokes GPT-5.5 through the Amazon Bedrock Mantle endpoint
  using the OpenAI Responses API.

Parameters:
  BedrockRegion:
    Type: String
    Default: us-east-1
    AllowedValues:
      - us-east-1
      - us-east-2
    Description: Target region for Bedrock Mantle inference.
  ApiKeySecretName:
    Type: String
    Default: BEDROCK_API_KEY
    Description: Name of the existing Secrets Manager secret holding the Bedrock Mantle API key.

Resources:
  GPT55Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Layers:
        - !Ref OpenAILayer
      Environment:
        Variables:
          API_KEY_SECRET_ID: !Ref ApiKeySecretName
          BEDROCK_REGION: !Ref BedrockRegion
      Events:
        InvokeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /invoke
            Method: post
      Policies:
        - arn:aws:iam::aws:policy/AmazonBedrockMantleInferenceAccess
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApiKeySecretName}-*

  OpenAILayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: openai-sdk
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12

  # Public, unauthenticated HTTP API (demo). Throttling caps the blast radius
  # if the endpoint is discovered/abused.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

Outputs:
  FunctionName:
    Description: Name of the deployed Lambda function.
    Value: !Ref GPT55Function
  ApiKeySecretName:
    Description: Name of the Secrets Manager secret the function reads.
    Value: !Ref ApiKeySecretName
  InvokeUrl:
    Description: Public POST endpoint for the function (no authentication).
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/invoke
