# dbt project orchestrated by MWAA via Astronomer Cosmos (dags/dbt_anycompany_analytics.py).
# Target: provisioned Redshift cluster `analytics-cluster`, database `dev`, schema `dbt_anycompany`.
# The connection profile is NOT stored here — Cosmos builds it at runtime from the
# Airflow connection `redshift_analytics_cluster` (Secrets Manager backend).
name: anycompany_analytics
version: "1.0.0"
config-version: 2
profile: anycompany_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

seeds:
  anycompany_analytics:
    +schema: raw
    raw_transactions:
      +column_types:
        transaction_id: varchar(64)
        customer_id: varchar(64)
        amount: decimal(12,2)
        region: varchar(32)
        date: date
        category: varchar(32)
    raw_customers:
      +column_types:
        customer_id: varchar(64)
        customer_name: varchar(128)
        segment: varchar(32)
        home_region: varchar(32)
        onboarded_date: date

models:
  anycompany_analytics:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]
